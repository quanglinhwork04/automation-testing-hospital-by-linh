<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <title>Medicate – Doctor</title>
    <!-- Favicon Icon -->
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- LOADING FONTS AND ICONS -->
    <link rel="stylesheet" type="text/css" href="css/pe-icon-7-stroke.css">
    <link rel="stylesheet" type="text/css" href="css/font-awesome.css">
    <!-- REVOLUTION STYLE SHEETS -->
    <link rel="stylesheet" type="text/css" href="css/rs6.css">
    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <!-- Progressbar CSS -->
    <link rel="stylesheet" href="css/progressbar.css">
    <!-- Animation CSS -->
    <link rel="stylesheet" href="css/animations.min.css">
    <!-- Magnefic Popup CSS -->
    <link rel="stylesheet" href="css/magnific-popup.min.css">
    <!-- Icons CSS -->
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/themify-icons.css">
    <!--  Style CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!--  Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3); /* Gradient nền tương tự trang đặt lịch */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px; /* Giới hạn chiều rộng form */
        }
        .form {
            background: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Shadow nhẹ */
            width: 100%;
            text-align: center;
        }
        .form h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1.5rem;
        }
        .validationError {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 0.5rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .form input[type="text"],
        .form input[type="password"] {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.9rem;
            color: #374151;
            margin-bottom: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form input[type="text"]:focus,
        .form input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-check {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1rem;
        }
        .form-check-input {
            margin-right: 0.5rem;
            cursor: pointer;
        }
        .check {
            font-size: 0.9rem;
            color: #1f2937;
            font-weight: 500;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.6rem 1.2rem;
            background: linear-gradient(to right, #3b82f6, #60a5fa); /* Gradient nút giống trang đặt lịch */
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 0.375rem;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn:hover {
            background: linear-gradient(to right, #2563eb, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 640px) {
            .container {
                padding: 0 1rem;
            }
            .form {
                padding: 1.5rem;
            }
            .form h2 {
                font-size: 1.25rem;
            }
            .form input[type="text"],
            .form input[type="password"] {
                font-size: 0.85rem;
            }
            .btn {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form">
        <h2>Đăng nhập bác sỹ</h2>
        <div th:if="${param.error}" class="validationError">
            <h4 style="color: #dc2626">Sai tên người dùng hoặc mật khẩu</h4>
        </div>
        <form th:action="@{/bacsy/login}" method="POST">
            <input id="username-doctor" type="text" name="username" placeholder="Tên người dùng" />
            <input id="password-doctor" type="password" name="password" placeholder="Mật khẩu" />
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe">
                <label class="check" for="rememberMe">Ghi nhớ đăng nhập</label>
            </div>
            <input id="btnlogin-doctor" type="submit" value="Đăng nhập" class="btn">
        </form>
    </div>
</div>
</body>
</html>
